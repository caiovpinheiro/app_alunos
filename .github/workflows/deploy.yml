name: Deploy EasyPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: easypanel-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar deploy no EasyPanel
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_APP }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "Secret EASYPANEL_DEPLOY_APP não encontrado. Cadastre a Deployment Trigger URL do EasyPanel em Settings → Secrets."
            exit 1
          fi
          code=$(curl -sS -o /tmp/easypanel-deploy-body.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            --data "{}" \
            "$DEPLOY_URL")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "EasyPanel respondeu HTTP $code"
            exit 1
          fi
          echo "Imagem ${IMAGE}:latest publicada. Deploy disparado (HTTP $code)."
